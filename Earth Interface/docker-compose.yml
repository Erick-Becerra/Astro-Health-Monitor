services:
  earth-interface:
    build: ./frontend
    environment:
      VITE_EARTH_URL: ${EARTH_URL:-http://localhost:8000}
      VITE_STATION_URL: ${STATION_URL:-http://localhost:8001}
      VITE_ACTOR: ${ACTOR:-Earth Interface}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
